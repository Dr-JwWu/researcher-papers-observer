<!DOCTYPE html>
<!--
  ResearcherPapers 论文日报首页（中文，本站数据源）。

  来源与变更声明 / Provenance notice:
    本文件由上游 daily-arXiv-ai-enhanced index.html
    （main 01fdad3b0aec2d2f7977b686253a7b0c1c8273dc，Modified Apache License；
     参考 .upstream/daily-arxiv，许可证副本见 docs/licenses/daily-arxiv-LICENSE）
    改写而来。上游版权归其原作者，本项目不重新许可、不改标 MIT。
    本文件为修改后的衍生文件，主要变更：
      1. 删除 flatpickr / Google Fonts 等 CDN 资源；2026-10 阅读改版进一步删除
         日期选择弹窗与区间切换：页面按报告日期倒序连续展开所有已有日报，
         最新在顶部，每个日期一个 heading（日期 + 收录篇数）；
      2. 删除 auth-config.js / auth.js 与登录守卫、退出口令按钮
         （纯前端口令不构成访问控制，属于安全误导）；
      3. 删除 GitHub 星标/派生数（外部 API）与 GitHub 头部按钮，保留页脚归属说明；
      4. data-config.js 不再注入 GitHub 仓库信息，数据源为本站相对 data/ 目录；
      5. 顶栏“分类筛选”改为“主题筛选”（topics：embodied/surgical，允许双命中）；
         改版后只有两个主题按钮、没有“全部”：初始都不选即两个主题都显示，
         再点一次取消；主题不再作为卡片/详情的标签展示；
      6. 删除当日总结面板（digest 正文与工程计数）；来源状态同一时刻只保留一行短句，
         同日修订只作为日期 heading 的短标注；
      7. 模态框底部链接改为：摘要页 / 代码仓库（有才显示）/ 复制链接，
         删除 PDF 预览 iframe 与 PDF 按钮、KimiChat 第三方预填链接
         与 abs→pdf/html 字符串替换；
      8. 精简为研究者阅读页面：删除首发验证 banner、“无访问控制/不可信数据”
         安全横幅、research_scope 与流程计数、重复免责声明与原始 paper id；
         来源与许可集中到 NOTICE.html，页脚只留署名与关于链接。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="具身智能与手术机器人/手术AI 中文论文日报（本站数据源，AI 摘要仅依据摘要）">
    <title>论文日报 - ResearcherPapers</title>
    <link rel="icon" type="image/png" href="assets/logo2-removebg-preview.png">
    <link rel="shortcut icon" type="image/png" href="assets/logo2-removebg-preview.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/pd-adapt.css">

    <!-- 数据源配置：本站相对目录（无外部主机、无 CI 注入） -->
    <script src="js/data-config.js"></script>
    <script>
        // 纯静态页面：出错时只给一句提示，不向页面倾倒内部错误信息。
        window.addEventListener('error', function () {
            var box = document.createElement('div');
            box.className = 'runtime-error';
            box.textContent = '页面出错了，请刷新重试。';
            document.body.appendChild(box);
            setTimeout(function () { box.remove(); }, 6000);
        });
    </script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-content">
                <div class="header-left">
                    <a href="NOTICE.html" class="about-link" title="来源、许可与免责说明">来源与许可</a>
                </div>

                <div class="header-center">
                    <a href="index.html" class="site-logo">
                        <img src="assets/logo2-removebg-preview.png" alt="ResearcherPapers 论文日报" class="logo-image">
                        <span class="site-title">ResearcherPapers 论文日报</span>
                    </a>
                </div>

                <div class="header-controls">
                    <div class="date-selector">
                        <div class="date-display">
                            <!-- 不再有日历日期选择：页面按报告日期倒序连续展示所有已有日报 -->
                            <span id="currentDate">Loading...</span>
                        </div>
                    </div>
                    <a href="statistic.html" class="icon-button" title="统计">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M9 17H7V10H9V17ZM13 17H11V7H13V17ZM17 17H15V13H17V17ZM19 19H5V5H19V19.1V19ZM19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3Z" fill="currentColor"/>
                        </svg>
                    </a>
                    <a href="settings.html" class="icon-button" title="偏好设置">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/>
                        </svg>
                    </a>
                </div>
            </div>
            <div class="category-nav">
                <div class="category-label-container">
                    <span class="category-nav-label">主题</span>
                    <div class="category-scroll">
                        <!-- 主题按钮由 app.js 按 topics 生成（允许双命中） -->
                    </div>
                </div>
                <div class="filter-label-container">
                    <span class="filter-nav-label">筛选</span>
                    <div id="textSearchContainer" class="text-search">
                        <button id="textSearchToggle" class="icon-button" title="搜索" type="button">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M10.5 3a7.5 7.5 0 105.07 13.07l3.68 3.68a1 1 0 001.41-1.41l-3.68-3.68A7.5 7.5 0 0010.5 3zm0 2a5.5 5.5 0 110 11 5.5 5.5 0 010-11z" fill="currentColor"/>
                            </svg>
                        </button>
                        <div class="search-input-wrapper" style="display: none;">
                            <input id="textSearchInput" type="text" placeholder="输入关键词搜索（标题、作者、摘要）" aria-label="搜索">
                            <button id="textSearchClear" class="clear-x" title="清除" type="button" style="display: none;">×</button>
                        </div>
                    </div>
                    <div class="filter-scroll" id="filterTags">
                        <!-- 用户关键词/作者标签由 app.js 生成 -->
                    </div>
                </div>
            </div>
        </header>

        <main>
            <div id="paperContainer" class="paper-container">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p>正在加载论文…</p>
                </div>
            </div>
        </main>

        <div class="paper-modal" id="paperModal">
            <div class="paper-modal-content">
                <div class="paper-modal-header">
                    <h2 id="modalTitle">论文详情</h2>
                    <button id="closeModal" class="icon-button" type="button" title="关闭">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
                <div class="paper-modal-body" id="modalBody">
                </div>
                <div class="paper-modal-footer">
                    <div class="paper-navigation">
                        <span class="navigation-hint">← → 切换 · 空格随机</span>
                        <span id="paperPosition" class="paper-position">-</span>
                    </div>
                    <div class="paper-modal-buttons" id="modalActions">
                        <a id="absLink" href="#" target="_blank" rel="noopener noreferrer" class="button icon-button primary" title="打开摘要页">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zM5 5h6V3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-6h-2v6H5V5z" fill="currentColor"/>
                            </svg>
                        </a>
                        <a id="codeLink" href="#" target="_blank" rel="noopener noreferrer" class="button icon-button" title="代码仓库" style="display: none;">
                            <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill="#a42c25"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p>ResearcherPapers 论文日报</p>
            <p class="footer-attribution"><a href="NOTICE.html">来源、许可与免责说明</a></p>
        </div>
    </footer>

    <button id="backToTop" class="back-to-top" title="回到顶部" type="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M7 14L12 9L17 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <noscript>
        <p class="noscript-notice">本页需要 JavaScript 才能读取本站 data/ 目录下的日报数据；未启用脚本时不会发送任何请求。</p>
    </noscript>

    <script src="js/pd-core.js"></script>
    <script src="js/pd-i18n.js"></script>
    <script src="js/pd-dom.js"></script>
    <script src="js/pd-prefs.js"></script>
    <script src="js/pd-render.js"></script>
    <script src="js/app.js?v=2.0.0"></script>
</body>
</html>
