<!DOCTYPE html>
<!--
  ResearcherPapers 偏好设置页。

  来源与变更声明 / Provenance notice:
    本文件由上游 daily-arXiv-ai-enhanced settings.html
    （main 01fdad3b0aec2d2f7977b686253a7b0c1c8273dc，Modified Apache License；
     参考 .upstream/daily-arxiv，许可证副本见 docs/licenses/daily-arxiv-LICENSE）
    改写而来。上游版权归其原作者，本项目不重新许可、不改标 MIT。
    本文件为修改后的衍生文件，主要变更：
      1. 删除 auth-config.js / auth.js、登录守卫与退出按钮（纯前端口令不是访问控制）；
      2. 删除 Google Fonts 与 GitHub 星标/派生数外部 API 调用；
      3. 本机存储说明压缩为一句话（删除输入限制工程说明）；
      4. 偏好标签改由 pd-settings.js 用 DOM API 构建（原 innerHTML 注入面已消除）。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ResearcherPapers 偏好设置：本机关键词与作者筛选">
    <title>偏好设置 - ResearcherPapers</title>
    <link rel="icon" type="image/png" href="assets/logo2-removebg-preview.png">
    <link rel="shortcut icon" type="image/png" href="assets/logo2-removebg-preview.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/pd-adapt.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-content">
                <div class="header-left">
                    <a href="NOTICE.html" class="about-link" title="来源、许可与免责说明">来源与许可</a>
                </div>

                <div class="header-center">
                    <a href="index.html" class="site-logo">
                        <img src="assets/logo2-removebg-preview.png" alt="ResearcherPapers 论文日报" class="logo-image">
                        <span class="site-title">ResearcherPapers 论文日报</span>
                    </a>
                </div>

                <div class="header-controls">
                    <a href="index.html" class="back-button" title="返回首页">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M20 11H7.83L13.42 5.41L12 4L4 12L12 20L13.41 18.59L7.83 13H20V11Z" fill="currentColor"/>
                        </svg>
                    </a>
                </div>
            </div>
        </header>

        <main class="settings-page">
            <div class="settings-container">
                <div class="settings-header">
                    <h1>偏好设置</h1>
                    <p>按关键词与作者在日报中优先排序、高亮；偏好只保存在本机浏览器，不会上传。</p>
                </div>

                <div class="settings-content">
                    <div class="settings-section">
                        <div class="keyword-section-title">
                            <div class="keyword-section-title-left">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7V17C3 18.1 3.9 18.99 5 18.99L16 19C16.67 19 17.27 18.67 17.63 18.16L22 12L17.63 5.84ZM16 17H5V7H16L19.55 12L16 17Z" fill="currentColor"/>
                                </svg>
                                感兴趣的关键词
                            </div>
                            <button id="copyKeywords" class="copy-button" title="复制关键词" type="button">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" fill="currentColor"/>
                                </svg>
                                复制
                            </button>
                        </div>
                        <div class="settings-card">
                            <div class="settings-item">
                                <div class="tag-selector">
                                    <div class="selected-tags" id="selectedKeywords"></div>
                                    <div class="tag-input-container">
                                        <input type="text" id="keywordInput" class="settings-input" placeholder="输入关键词后回车…">
                                        <button id="addKeyword" class="add-tag-button" type="button">添加</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="settings-section">
                        <div class="keyword-section-title">
                            <div class="keyword-section-title-left">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/>
                                </svg>
                                感兴趣的作者
                            </div>
                            <button id="copyAuthors" class="copy-button" title="复制作者" type="button">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" fill="currentColor"/>
                                </svg>
                                复制
                            </button>
                        </div>
                        <div class="settings-card">
                            <div class="settings-item">
                                <div class="tag-selector">
                                    <div class="selected-tags" id="selectedAuthors"></div>
                                    <div class="tag-input-container">
                                        <input type="text" id="authorInput" class="settings-input" placeholder="输入作者姓名后回车…">
                                        <button id="addAuthor" class="add-tag-button" type="button">添加</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="settings-section" id="syncSection">
                        <div class="keyword-section-title">
                            <div class="keyword-section-title-left">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="currentColor"/>
                                </svg>
                                已读与收藏同步（可选）
                            </div>
                        </div>
                        <div class="settings-card">
                            <p class="settings-help">已读和收藏默认只保存在本机浏览器。填写你自己 GitHub 私有仓库里的一个 JSON 文件和 fine-grained token 后，可在多台设备间同步；token 只存在本机浏览器，不写进仓库、不写进页面。</p>
                            <div class="settings-item">
                                <label class="settings-label" for="syncRepo">数据仓库（owner/repo）</label>
                                <input id="syncRepo" class="settings-input" type="text" autocomplete="off" spellcheck="false">
                            </div>
                            <div class="settings-item">
                                <label class="settings-label" for="syncPath">文件路径</label>
                                <input id="syncPath" class="settings-input" type="text" autocomplete="off" spellcheck="false">
                            </div>
                            <div class="settings-item">
                                <label class="settings-label" for="syncToken">访问令牌（只存本机）</label>
                                <input id="syncToken" class="settings-input" type="password" autocomplete="new-password" placeholder="留空表示保留已保存的令牌">
                            </div>
                            <div class="settings-item settings-sync-actions">
                                <button id="syncSave" class="button primary" type="button">保存并同步</button>
                                <button id="syncClear" class="button" type="button">清除令牌</button>
                                <button id="syncExport" class="button" type="button">导出收藏</button>
                                <label class="button settings-import-label" for="syncImport">导入</label>
                                <input id="syncImport" type="file" accept="application/json" hidden>
                            </div>
                            <p id="syncStatus" class="settings-sync-status" role="status"></p>
                        </div>
                    </div>
                </div>

                <div class="settings-actions">
                    <button id="resetSettings" class="button" type="button">重置</button>
                    <button id="saveSettings" class="button primary" type="button">保存设置</button>
                </div>
            </div>
        </main>

        <footer>
            <div class="footer-content">
                <p>ResearcherPapers 论文日报</p>
                <p class="footer-attribution"><a href="NOTICE.html">来源、许可与免责说明</a></p>
            </div>
        </footer>
    </div>

    <script src="js/pd-core.js"></script>
    <script src="js/pd-i18n.js"></script>
    <script src="js/pd-dom.js"></script>
    <script src="js/pd-prefs.js"></script>
    <script src="js/pd-user-state.js"></script>
    <script src="js/pd-settings.js"></script>
    <script src="js/pd-sync-settings.js"></script>
</body>
</html>
