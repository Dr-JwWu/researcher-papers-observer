<!DOCTYPE html>
<!--
  ResearcherPapers 统计页（只统计已收录样本）。

  来源与变更声明 / Provenance notice:
    本文件由上游 daily-arXiv-ai-enhanced statistic.html
    （main 01fdad3b0aec2d2f7977b686253a7b0c1c8273dc，Modified Apache License；
     参考 .upstream/daily-arxiv，许可证副本见 docs/licenses/daily-arxiv-LICENSE）
    改写而来。上游版权归其原作者，本项目不重新许可、不改标 MIT。
    本文件为修改后的衍生文件，主要变更：
      1. 删除 flatpickr / d3 / d3-cloud / compromise / chart.js 等 CDN 脚本
         与 Google Fonts，统计图改为内置 SVG 渲染（无外部请求）；
      2. 删除 auth-config.js / auth.js、登录守卫与退出按钮；
      3. 删除 GitHub 星标/派生数外部 API 调用；
      4. 日期选择改原生 input[type=date]；
      5. 不再放“仅统计已收录样本/不补 0”这类常驻口径 defence：缺失日期仍逐日
         如实列出、不补 0，事实说明保留在缺口清单里；
      6. 精简：删除工程说明区块；页脚只留署名与关于链接。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ResearcherPapers 统计：关键词与趋势">
    <title>统计 - ResearcherPapers</title>
    <link rel="icon" type="image/png" href="assets/logo2-removebg-preview.png">
    <link rel="shortcut icon" type="image/png" href="assets/logo2-removebg-preview.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/statistic.css">
    <link rel="stylesheet" href="css/pd-adapt.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-content">
                <div class="header-left">
                    <a href="NOTICE.html" class="about-link" title="来源、许可与免责说明">来源与许可</a>
                </div>

                <div class="header-center">
                    <a href="index.html" class="site-logo">
                        <img src="assets/logo2-removebg-preview.png" alt="ResearcherPapers 论文日报" class="logo-image">
                        <span class="site-title">ResearcherPapers 论文日报</span>
                    </a>
                </div>

                <div class="header-controls">
                    <div class="date-selector">
                        <div class="date-display">
                            <span id="currentDate">Loading...</span>
                            <button id="calendarButton" class="icon-button" title="选择日期" type="button">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M19 4H18V2H16V4H8V2H6V4H5C3.89 4 3.01 4.9 3.01 6L3 20C3 21.1 3.89 22 5 22H19C20.1 22 21 21.1 21 20V6C21 4.9 20.1 4 19 4ZM19 20H5V9H19V20ZM7 11H12V16H7V11Z" fill="currentColor"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <a href="index.html" class="back-button" title="返回首页">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M20 11H7.83L13.42 5.41L12 4L4 12L12 20L13.41 18.59L7.83 13H20V11Z" fill="currentColor"/>
                        </svg>
                    </a>
                </div>
            </div>
        </header>

        <main class="statistics-page">
            <div class="statistics-container">
                <div class="statistics-header">
                    <h1>统计</h1>
                </div>

                <div class="statistics-content">
                    <div class="date-picker-modal" id="datePickerModal">
                        <div class="date-picker-content">
                            <div class="date-picker-body">
                                <h3 class="date-picker-title">选择日期</h3>
                                <div class="flatpickr-container">
                                    <div id="datepicker" class="native-datepicker"></div>
                                </div>
                                <div class="date-range-selector">
                                    <span class="toggle-label">区间</span>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="dateRangeMode">
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="papersList">
                        <!-- 统计数据由 statistic.js 渲染 -->
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="footer-content">
                <p>ResearcherPapers 论文日报 · 统计</p>
                <p class="footer-attribution"><a href="NOTICE.html">来源、许可与免责说明</a></p>
            </div>
        </footer>
    </div>

    <div id="paperSidebar" class="paper-sidebar">
        <div class="sidebar-header">
            <div class="header-content">
                <h3 id="selectedKeyword"></h3>
            </div>
            <button class="close-sidebar" type="button" title="关闭">&times;</button>
        </div>
        <div class="sidebar-content">
            <div id="relatedPapers" class="related-papers">
                <!-- 相关论文由 statistic.js 渲染 -->
            </div>
        </div>
    </div>

    <noscript>
        <p class="noscript-notice">本页需要 JavaScript 才能读取本站 data/ 目录下的数据；未启用脚本时不会发送任何请求。</p>
    </noscript>

    <script src="js/pd-core.js"></script>
    <script src="js/pd-i18n.js"></script>
    <script src="js/pd-dom.js"></script>
    <script src="js/pd-stat.js"></script>
    <script src="js/statistic.js"></script>
</body>
</html>
